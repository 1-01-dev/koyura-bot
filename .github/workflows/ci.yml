name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: bot
            working-directory: bot
            requirements: requirements-dev.txt
            test-path: tests/
          - service: dashboard
            working-directory: dashboard
            requirements: requirements-dev.txt
            test-path: tests/
          - service: koyura-engine
            working-directory: koyura
            requirements: requirements-dev.txt
            test-path: tests/
          - service: config
            working-directory: .
            requirements: .github/requirements-dev.txt
            test-path: .github/tests/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Set up Python
        # v5
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ${{ matrix.working-directory }}/${{ matrix.requirements }}

      - name: Install dependencies
        working-directory: ${{ matrix.working-directory }}
        run: pip install -r ${{ matrix.requirements }}

      - name: Run tests
        working-directory: ${{ matrix.working-directory }}
        run: python -m pytest ${{ matrix.test-path }} -q

  compose-config:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Validate compose file
        env:
          BOT_TOKEN: test-token
          TELEGRAM_API_ID: "123456"
          TELEGRAM_API_HASH: test-hash
          INTERNAL_API_TOKEN: test-internal-token-0123456789abcdef
          DASHBOARD_PASSWORD: test-password
          DASHBOARD_SECRET_KEY: test-secret-key-0123456789abcdef0123456789
        run: docker compose config --quiet

      - name: No secret files tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env must never be committed"
            exit 1
          fi

  systemd-units:
    name: systemd units verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      # systemd-analyze verify wants the paths referenced by the units to
      # exist, so stub the documented native layout first.
      - name: Stub native layout
        run: |
          sudo useradd --system --home /opt/koyura \
            --shell /usr/sbin/nologin koyura || true
          sudo install -d -o koyura -g koyura \
            /opt/koyura/.venv/bin /opt/koyura/koyura \
            /opt/koyura/bot /opt/koyura/dashboard
          sudo install -d -m 0750 -o root -g koyura /etc/koyura
          printf 'TELEGRAM_API_ID=1\nTELEGRAM_API_HASH=test\n' \
            | sudo tee /etc/koyura/koyura.env >/dev/null
          sudo touch /opt/koyura/.venv/bin/python \
            /opt/koyura/.venv/bin/uvicorn /usr/local/bin/telegram-bot-api
          sudo chmod +x /opt/koyura/.venv/bin/python \
            /opt/koyura/.venv/bin/uvicorn /usr/local/bin/telegram-bot-api

      - name: Verify units
        run: |
          sudo cp deploy/systemd/*.service /etc/systemd/system/
          sudo systemd-analyze verify koyura-engine.service \
            koyura-dashboard.service koyura-bot.service \
            koyura-telegram-bot-api.service
