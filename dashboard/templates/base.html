<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="csrf-token" content="{{ csrf_token | default('') }}" />
  <meta name="color-scheme" content="light dark" />
  <title>Koyura Admin{% block title %}{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/static/koyura.css" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="/static/theme.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
</head>
<body>

  <!-- Hamburger button (mobile only) -->
  <button class="hamburger" id="hamburger" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">Koyura<span class="brand-jp" aria-hidden="true">コユラ</span></div>
    <nav class="sidebar-nav" aria-label="Main">
      <a href="/" class="nav-item{% if active == 'dashboard' %} active{% endif %}" aria-current="{{ 'page' if active == 'dashboard' else 'false' }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="/history" class="nav-item{% if active == 'history' %} active{% endif %}" aria-current="{{ 'page' if active == 'history' else 'false' }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
        <span>History</span>
      </a>
      <a href="/errors" class="nav-item{% if active == 'errors' %} active{% endif %}" aria-current="{{ 'page' if active == 'errors' else 'false' }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <span>Errors</span>
      </a>
      <a href="/admin" class="nav-item{% if active == 'admin' %} active{% endif %}" aria-current="{{ 'page' if active == 'admin' else 'false' }}">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
        <span>Admin</span>
      </a>
    </nav>
    <div class="sidebar-bottom">
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false">Invert color · dark</button>
      <form method="post" action="/logout" class="logout-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token | default('') }}" />
        <button type="submit" class="nav-item nav-item--button">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span>Logout</span>
        </button>
      </form>
    </div>
  </aside>

  <!-- Sidebar overlay (mobile) -->
  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <!-- Main content -->
  <main class="content">
    <div class="content-inner">
      {% block content %}{% endblock %}
      <footer class="site-footer mono">
        <span>©2026 Koyura</span>
        <span>[ self-hosted · MIT ]</span>
      </footer>
    </div>
  </main>

  <!-- Toast container -->
  <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  <script src="/static/shell.js"></script>
  <script type="module" src="/static/dashboard.js"></script>
</body>
</html>
